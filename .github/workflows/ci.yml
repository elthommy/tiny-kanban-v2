name: CI

on:
  push:
    branches: [master]
  pull_request:

# Don't waste minutes on outdated pushes to the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# CI only reads the code; keep the token read-only whatever the repo default.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Lint
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Tests
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Tests
        run: npm test
      - name: Typecheck & build
        run: npm run build

  # Browser sanity checks: the built UI + real API in Chromium (tests_e2e/).
  # A separate job so a UI break shows up apart from backend/frontend failures.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Build UI
        working-directory: frontend
        run: npm ci && npm run build
      - name: Install Chromium
        working-directory: backend
        run: uv run --group e2e playwright install --with-deps chromium
      - name: Browser tests
        working-directory: backend
        run: uv run --group e2e pytest tests_e2e
