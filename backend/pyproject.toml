[project]
name = "tiny-kanban"
version = "0.1.0"
description = "Backend for Tiny-kanban v2: FastAPI + SQLAlchemy + SQLite"
authors = [
    { name = "Thomas BARBIER" }
]
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.1",
    "sqlalchemy>=2.0",
    "alembic>=1.19.0",
    "pydantic-settings>=2.7",
    "mcp>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx2>=2.9.1",
    "ruff>=0.16.1",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.ruff.lint]
# Pin an explicit, deliberately small rule set: real errors (E/F), import
# sorting (I) and modern-syntax rewrites (UP). Without this we inherit ruff's
# default set, which grows between releases and flags idiomatic FastAPI code
# (e.g. B008 on `Depends(...)` defaults).
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# Migrations are generated from alembic's template; don't fight it.
"alembic/versions/*" = ["I001", "UP"]

[tool.ruff.lint.isort]
# The `alembic/` directory at the repo root makes ruff guess that the alembic
# package is first-party.
known-third-party = ["alembic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
